# RAGBench Model Pricing Configuration
# Pricing expressed per 1,000,000 (1M) tokens in USD
models:
  - model: "gpt-4o-mini"
    input_cost_per_1m_tokens: 0.150
    output_cost_per_1m_tokens: 0.600
    currency: "USD"
    effective_date: "2024-07-18"

  - model: "gpt-4o"
    input_cost_per_1m_tokens: 2.500
    output_cost_per_1m_tokens: 10.000
    currency: "USD"
    effective_date: "2024-08-06"

  - model: "gpt-3.5-turbo"
    input_cost_per_1m_tokens: 0.500
    output_cost_per_1m_tokens: 1.500
    currency: "USD"
    effective_date: "2024-01-25"

  - model: "text-embedding-3-small"
    input_cost_per_1m_tokens: 0.020
    output_cost_per_1m_tokens: 0.000
    currency: "USD"
    effective_date: "2024-01-25"

  - model: "mock-llm"
    input_cost_per_1m_tokens: 1.000
    output_cost_per_1m_tokens: 2.000
    currency: "USD"
    effective_date: "2024-01-01"
